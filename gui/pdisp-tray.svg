<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- the tray glyph: one colour (the program tints it to the theme's text colour), a monitor and a phone in front of it -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="35" y="25" width="26" height="36" rx="8" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.5" y="8.5" width="45" height="31" rx="5"/>
    <path d="M28 40v8M17 52h22"/>
  </g>
  <rect x="39" y="29" width="18" height="28" rx="5" fill="none" stroke="#000" stroke-width="5"/>
  <circle cx="48" cy="51" r="2" fill="#000"/>
</svg>
