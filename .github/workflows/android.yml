name: Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['android/**', 'proto/**', 'third_party/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'proto/**', 'third_party/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used to attach the APK to a release on a v* tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The release key lives in repository secrets (docs/app.md, "Signing"). Pull requests from forks have no secrets: they get a debug-signed APK.
      - name: Restore the release keystore
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.PDISP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pdisp-release.jks"
            echo "path=$RUNNER_TEMP/pdisp-release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: android
        env:
          PDISP_VERSION_CODE: ${{ github.run_number }}
          PDISP_KEYSTORE: ${{ steps.key.outputs.path }}
          PDISP_KEYSTORE_PASSWORD: ${{ secrets.PDISP_KEYSTORE_PASSWORD }}
          PDISP_KEY_ALIAS: ${{ secrets.PDISP_KEY_ALIAS }}
          PDISP_KEY_PASSWORD: ${{ secrets.PDISP_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK and show its signer
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/pdisp-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk | head -4

      - uses: actions/upload-artifact@v4
        with:
          name: pdisp-apk
          path: dist/*.apk

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes
